<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clientes – Nexa Clínica Integrada</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/auth.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            primary:   { DEFAULT: '#c47a85', dark: '#b5606e', light: '#f5d5d8' },
            sidebar:   { DEFAULT: '#2d1f22', light: '#3d2a2e' },
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Poppins', sans-serif; }
    .sidebar { width: 240px; min-height: 100vh; background: #2d1f22; transition: width 0.3s; }
    .sidebar.collapsed { width: 68px; }
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .sidebar-title,
    .sidebar.collapsed .sidebar-subtitle,
    .sidebar.collapsed .user-name,
    .sidebar.collapsed .user-role { display: none; }
    .sidebar.collapsed .nav-item { justify-content: center; }
    .sidebar.collapsed .logo-wrap { justify-content: center; }

    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: 10px; cursor: pointer;
      transition: background 0.2s; color: #c8a5aa; font-size: 0.84rem;
      text-decoration: none;
    }
    .nav-item:hover { background: rgba(196,122,133,0.18); color: #f5d5d8; }
    .nav-item.active { background: rgba(196,122,133,0.28); color: #f5d5d8; font-weight: 600; }
    .nav-item svg { flex-shrink: 0; }

    .chart-card {
      background: #fff; border-radius: 14px; padding: 22px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .table-row:hover { background: #fdf2f4; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
    .badge-green  { background: #d1fae5; color: #065f46; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-red    { background: #fee2e2; color: #991b1b; }
    .badge-blue   { background: #dbeafe; color: #1e40af; }
    .badge-pink   { background: #fce7f3; color: #9d174d; }
    .badge-gray   { background: #f3f4f6; color: #4b5563; }

    .topbar { background: #fff; border-bottom: 1px solid #f0e6e8; }
    .main-content { overflow-y: auto; height: 100vh; }

    .tab-btn {
      padding: 8px 16px; border-radius: 8px; font-size: 0.82rem; font-weight: 500;
      color: #6b7280; transition: all 0.2s;
    }
    .tab-btn.active {
      background: #c47a85; color: #fff; font-weight: 600;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      display: none; align-items: center; justify-content: center; z-index: 60;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #fff; border-radius: 16px; width: 100%; max-width: 520px;
      padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f9fafb; }
    ::-webkit-scrollbar-thumb { background: #e5c5ca; border-radius: 3px; }

    @media (max-width: 768px) {
      .sidebar { position: fixed; z-index: 50; height: 100vh; }
      .sidebar:not(.open) { width: 0; overflow: hidden; }
      .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 40; }
      .overlay.show { display: block; }
    }
  </style>
</head>
<body class="bg-gray-50 flex" style="min-height:100vh;">

<!-- SIDEBAR -->
<aside class="sidebar flex flex-col" id="sidebar">
  <div id="sidebarContent" class="flex flex-col h-full"></div>
</aside>

<!-- Mobile Overlay -->
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- MAIN -->
<div class="flex-1 flex flex-col main-content">

  <!-- TOPBAR -->
  <header class="topbar sticky top-0 z-30 flex items-center justify-between px-6 py-3.5">
    <div class="flex items-center gap-4">
      <button onclick="toggleSidebar()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div>
        <h1 class="text-gray-800 font-semibold text-base">Gerenciamento de Clientes</h1>
        <p class="text-gray-400 text-xs" id="dataAtual"></p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 cursor-pointer">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
             style="background:linear-gradient(135deg,#f5d5d8,#e8b4ba);color:#b5606e;" id="topAvatar">C</div>
        <div class="hidden sm:block">
          <div class="flex items-center gap-2">
            <p class="text-gray-700 text-xs font-semibold" id="topUserName">Usuário</p>
            <span id="perfilBadge"></span>
          </div>
          <p class="text-gray-400 text-xs" id="topUserRole">Perfil</p>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 p-6 space-y-6">

    <!-- Header Actions & Search -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <!-- Tabs -->
      <div class="flex items-center gap-2 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100 flex-wrap">
        <button class="tab-btn active" onclick="setTab('todos', this)" id="tabTodos">
          Todos <span class="ml-1 text-xs opacity-80" id="cntTodos">(0)</span>
        </button>
        <button class="tab-btn" onclick="setTab('ativo', this)" id="tabAtivos">
          Ativos <span class="ml-1 text-xs opacity-80" id="cntAtivos">(0)</span>
        </button>
        <button class="tab-btn" onclick="setTab('potencial', this)" id="tabPotenciais">
          Potenciais <span class="ml-1 text-xs opacity-80" id="cntPotenciais">(0)</span>
        </button>
        <button class="tab-btn" onclick="setTab('inativo', this)" id="tabInativos">
          Inativos <span class="ml-1 text-xs opacity-80" id="cntInativos">(0)</span>
        </button>
      </div>

      <!-- Search & New Button -->
      <div class="flex items-center gap-3">
        <div class="relative">
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Buscar por nome, tel, e-mail..."
                 class="w-64 md:w-80 pl-9 pr-4 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:border-rose-400 bg-white shadow-sm"/>
          <svg class="absolute left-3 top-2.5 text-gray-400" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>

        <button data-perm="clientes.criar" onclick="abrirModalNovo()"
                class="flex items-center gap-2 bg-[#c47a85] hover:bg-[#b5606e] text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-sm transition-all flex-shrink-0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Novo Cliente</span>
        </button>
      </div>
    </div>

    <!-- Table Card -->
    <div class="chart-card overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-600">
          <thead>
            <tr class="border-b border-gray-100 text-gray-400 uppercase tracking-wider text-[11px] pb-3">
              <th class="py-3 px-4 font-semibold">Cliente</th>
              <th class="py-3 px-4 font-semibold">Telefone</th>
              <th class="py-3 px-4 font-semibold">E-mail</th>
              <th class="py-3 px-4 font-semibold">Status / Tipo</th>
              <th class="py-3 px-4 font-semibold">Última Visita</th>
              <th class="py-3 px-4 font-semibold">Último Procedimento</th>
              <th class="py-3 px-4 font-semibold text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaClientes" class="divide-y divide-gray-50">
            <!-- Rendered by JS -->
          </tbody>
        </table>
      </div>

      <div id="emptyState" class="hidden py-12 text-center text-gray-400">
        <svg class="mx-auto mb-3 opacity-40" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        <p class="text-sm font-medium">Nenhum cliente encontrado com os filtros selecionados.</p>
      </div>
    </div>

  </main>
</div>

<!-- MODAL: NOVO / EDITAR CLIENTE -->
<div class="modal-overlay" id="modalCliente">
  <div class="modal-box">
    <div class="flex items-center justify-between pb-4 border-b border-gray-100">
      <h3 class="font-semibold text-gray-800 text-sm" id="modalClienteTitulo">Novo Cliente</h3>
      <button onclick="fecharModalCliente()" class="text-gray-400 hover:text-gray-600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form id="formCliente" onsubmit="salvarCliente(event)" class="mt-4 space-y-3">
      <input type="hidden" id="clienteId"/>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Nome Completo *</label>
        <input type="text" id="clienteNome" required placeholder="Ex: Maria da Silva"
               class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-rose-400"/>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Telefone / WhatsApp *</label>
          <input type="text" id="clienteTel" required placeholder="(11) 98765-4321"
                 class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-rose-400"/>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Tipo de Cliente</label>
          <select id="clienteTipo" class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-rose-400">
            <option value="ativo">Cliente Ativo</option>
            <option value="potencial">Potencial (Lead)</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">E-mail</label>
        <input type="email" id="clienteEmail" placeholder="cliente@exemplo.com"
               class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-rose-400"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Observações e Preferências</label>
        <textarea id="clienteObs" rows="3" placeholder="Restrições, alergias, horário de preferência..."
                  class="w-full px-3 py-2 text-xs border border-gray-200 rounded-lg focus:outline-none focus:border-rose-400"></textarea>
      </div>

      <div class="flex items-center justify-end gap-2 pt-3 border-t border-gray-100">
        <button type="button" onclick="fecharModalCliente()"
                class="px-4 py-2 text-xs font-medium text-gray-500 hover:bg-gray-100 rounded-lg transition-colors">
          Cancelar
        </button>
        <button type="submit"
                class="px-5 py-2 text-xs font-semibold text-white bg-[#c47a85] hover:bg-[#b5606e] rounded-lg shadow-sm transition-colors">
          Salvar Cliente
        </button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL: HISTÓRICO DO CLIENTE -->
<div class="modal-overlay" id="modalHistorico">
  <div class="modal-box max-w-lg">
    <div class="flex items-center justify-between pb-3 border-b border-gray-100">
      <h3 class="font-semibold text-gray-800 text-sm" id="histTitulo">Histórico de Atendimentos</h3>
      <button onclick="fecharModalHist()" class="text-gray-400 hover:text-gray-600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="mt-4 max-h-80 overflow-y-auto space-y-3" id="histConteudo">
      <!-- Injected by JS -->
    </div>

    <div class="pt-4 border-t border-gray-100 text-right">
      <button onclick="fecharModalHist()"
              class="px-4 py-2 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        Fechar
      </button>
    </div>
  </div>
</div>

<!-- MODAL: CONFIRMAR EXCLUSÃO -->
<div class="modal-overlay" id="modalExcluir">
  <div class="modal-box max-w-sm text-center">
    <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 mx-auto flex items-center justify-center mb-3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
    </div>
    <h3 class="font-semibold text-gray-800 text-sm">Confirmar Exclusão</h3>
    <p class="text-gray-500 text-xs mt-1" id="excluirMsg">Deseja realmente excluir este cliente?</p>

    <div class="flex items-center justify-center gap-2 mt-5">
      <button onclick="fecharModalExcluir()"
              class="px-4 py-2 text-xs font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        Cancelar
      </button>
      <button id="btnConfirmarExcluir"
              class="px-4 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-lg shadow-sm transition-colors">
        Sim, Excluir
      </button>
    </div>
  </div>
</div>

<script>
// ---- DADOS SIMULADOS ----
let CLIENTES = [
  { id:1, nome:'Ana Souza',      tel:'(11) 98765-4321', email:'ana@email.com',    tipo:'ativo',     ultimaVisita:'05/09/2026', ultimoProc:'Drenagem Linfática', obs:'Prefere horário matinal' },
  { id:2, nome:'Beatriz Lima',   tel:'(11) 91234-5678', email:'bea@email.com',    tipo:'ativo',     ultimaVisita:'03/09/2026', ultimoProc:'Limpeza de Pele', obs:'Pele sensível' },
  { id:3, nome:'Carla Ferreira', tel:'(11) 94444-3333', email:'carla@email.com',  tipo:'potencial', ultimaVisita:'-',          ultimoProc:'-', obs:'Veio pelo Instagram' },
  { id:4, nome:'Diana Rocha',    tel:'(11) 93333-2222', email:'diana@email.com',  tipo:'ativo',     ultimaVisita:'28/08/2026', ultimoProc:'Peeling Químico', obs:'' },
  { id:5, nome:'Elaine Matos',   tel:'(11) 92222-1111', email:'elaine@email.com', tipo:'inativo',   ultimaVisita:'10/07/2026', ultimoProc:'Radiofrequência', obs:'Parou tratamento' },
  { id:6, nome:'Flávia Costa',   tel:'(11) 95555-6666', email:'flavia@email.com', tipo:'ativo',     ultimaVisita:'06/09/2026', ultimoProc:'Redução de Medidas', obs:'' },
  { id:7, nome:'Gabi Alves',     tel:'(11) 96666-7777', email:'gabi@email.com',   tipo:'potencial', ultimaVisita:'-',          ultimoProc:'-', obs:'Indicação da Ana' },
  { id:8, nome:'Helena Dias',    tel:'(11) 97777-8888', email:'helena@email.com', tipo:'ativo',     ultimaVisita:'01/09/2026', ultimoProc:'Drenagem Linfática', obs:'Gestante - protocolo adaptado' },
];

const HISTORICO = {
  1: [
    { data:'05/09/2026', proc:'Drenagem Linfática', valor:'R$ 180,00', obs:'Sessão 8 de 10' },
    { data:'22/08/2026', proc:'Drenagem Linfática', valor:'R$ 180,00', obs:'Sessão 7 de 10' },
    { data:'08/08/2026', proc:'Redução de Medidas', valor:'R$ 220,00', obs:'Primeira sessão nova metodologia' },
  ],
  2: [
    { data:'03/09/2026', proc:'Limpeza de Pele', valor:'R$ 150,00', obs:'Pele reagiu muito bem' },
    { data:'03/08/2026', proc:'Limpeza de Pele', valor:'R$ 150,00', obs:'' },
  ],
  4: [
    { data:'28/08/2026', proc:'Peeling Químico', valor:'R$ 200,00', obs:'Retorno agendado' },
  ],
  6: [
    { data:'06/09/2026', proc:'Redução de Medidas', valor:'R$ 220,00', obs:'Resultado excelente' },
  ],
  8: [
    { data:'01/09/2026', proc:'Drenagem Linfática', valor:'R$ 180,00', obs:'Protocolo gestante suave' },
  ]
};

let currentTab = 'todos';
let searchQuery = '';
let clienteParaExcluir = null;

// ---- INICIALIZAÇÃO ----
document.addEventListener('DOMContentLoaded', () => {
  nexaInitPage('clientes');
  renderizar();
});

// ---- RENDERIZAÇÃO ----
function renderizar() {
  atualizarContadores();

  const tbody = document.getElementById('tabelaClientes');
  const emptyState = document.getElementById('emptyState');
  tbody.innerHTML = '';

  const filtrados = CLIENTES.filter(c => {
    const matchTab = currentTab === 'todos' || c.tipo === currentTab;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q || c.nome.toLowerCase().includes(q) ||
                              c.tel.toLowerCase().includes(q) ||
                              c.email.toLowerCase().includes(q);
    return matchTab && matchSearch;
  });

  if (filtrados.length === 0) {
    emptyState.classList.remove('hidden');
    return;
  } else {
    emptyState.classList.add('hidden');
  }

  const badgeConfig = {
    ativo:     { cls: 'badge-green',  txt: 'Ativo' },
    potencial: { cls: 'badge-yellow', txt: 'Potencial' },
    inativo:   { cls: 'badge-gray',   txt: 'Inativo' }
  };

  const avatarColors = {
    ativo:     { bg: '#fce7f3', color: '#be185d' },
    potencial: { bg: '#fef3c7', color: '#b45309' },
    inativo:   { bg: '#f3f4f6', color: '#6b7280' }
  };

  const podeExcluir = nexaPode('clientes', 'excluir');
  const podeEditar  = nexaPode('clientes', 'editar');
  const podeHist    = nexaPode('clientes', 'historico');

  filtrados.forEach(c => {
    const b = badgeConfig[c.tipo] || { cls: 'badge-gray', txt: c.tipo };
    const av = avatarColors[c.tipo] || { bg: '#f3f4f6', color: '#6b7280' };
    const ini = c.nome.charAt(0).toUpperCase();

    const tr = document.createElement('tr');
    tr.className = 'table-row transition-colors';
    tr.innerHTML = `
      <td class="py-3 px-4">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs flex-shrink-0"
               style="background:${av.bg};color:${av.color};">${ini}</div>
          <div>
            <p class="font-medium text-gray-800">${c.nome}</p>
            ${c.obs ? `<p class="text-[10px] text-gray-400 truncate max-w-xs">${c.obs}</p>` : ''}
          </div>
        </div>
      </td>
      <td class="py-3 px-4 font-mono text-[11px] text-gray-600">${c.tel}</td>
      <td class="py-3 px-4 text-gray-500">${c.email}</td>
      <td class="py-3 px-4"><span class="badge ${b.cls}">${b.txt}</span></td>
      <td class="py-3 px-4 text-gray-500">${c.ultimaVisita}</td>
      <td class="py-3 px-4 text-gray-600">${c.ultimoProc}</td>
      <td class="py-3 px-4 text-right">
        <div class="flex items-center justify-end gap-1.5">
          ${podeHist ? `
            <button onclick="verHistorico(${c.id})" title="Ver Histórico"
                    class="p-1.5 text-gray-400 hover:text-rose-600 hover:bg-rose-50 rounded-md transition-colors">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>` : ''}
          ${podeEditar ? `
            <button onclick="editarCliente(${c.id})" title="Editar"
                    class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>` : ''}
          ${podeExcluir ? `
            <button onclick="confirmarExclusao(${c.id})" title="Excluir"
                    class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>` : ''}
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function atualizarContadores() {
  const todos = CLIENTES.length;
  const ativos = CLIENTES.filter(c => c.tipo === 'ativo').length;
  const potenciais = CLIENTES.filter(c => c.tipo === 'potencial').length;
  const inativos = CLIENTES.filter(c => c.tipo === 'inativo').length;

  document.getElementById('cntTodos').textContent = `(${todos})`;
  document.getElementById('cntAtivos').textContent = `(${ativos})`;
  document.getElementById('cntPotenciais').textContent = `(${potenciais})`;
  document.getElementById('cntInativos').textContent = `(${inativos})`;
}

function setTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderizar();
}

function handleSearch() {
  searchQuery = document.getElementById('searchInput').value;
  renderizar();
}

// ---- MODAL CLIENTE ----
function abrirModalNovo() {
  document.getElementById('formCliente').reset();
  document.getElementById('clienteId').value = '';
  document.getElementById('modalClienteTitulo').textContent = 'Novo Cliente';
  document.getElementById('modalCliente').classList.add('show');
}

function editarCliente(id) {
  const c = CLIENTES.find(item => item.id === id);
  if (!c) return;
  document.getElementById('clienteId').value = c.id;
  document.getElementById('clienteNome').value = c.nome;
  document.getElementById('clienteTel').value = c.tel;
  document.getElementById('clienteEmail').value = c.email;
  document.getElementById('clienteTipo').value = c.tipo;
  document.getElementById('clienteObs').value = c.obs || '';
  document.getElementById('modalClienteTitulo').textContent = 'Editar Cliente';
  document.getElementById('modalCliente').classList.add('show');
}

function fecharModalCliente() {
  document.getElementById('modalCliente').classList.remove('show');
}

function salvarCliente(e) {
  e.preventDefault();
  const id = document.getElementById('clienteId').value;
  const nome = document.getElementById('clienteNome').value.trim();
  const tel = document.getElementById('clienteTel').value.trim();
  const email = document.getElementById('clienteEmail').value.trim();
  const tipo = document.getElementById('clienteTipo').value;
  const obs = document.getElementById('clienteObs').value.trim();

  if (id) {
    const idx = CLIENTES.findIndex(c => c.id === parseInt(id));
    if (idx !== -1) {
      CLIENTES[idx] = { ...CLIENTES[idx], nome, tel, email, tipo, obs };
    }
  } else {
    const novoId = CLIENTES.length ? Math.max(...CLIENTES.map(c => c.id)) + 1 : 1;
    CLIENTES.unshift({
      id: novoId,
      nome,
      tel,
      email,
      tipo,
      ultimaVisita: '-',
      ultimoProc: '-',
      obs
    });
  }

  fecharModalCliente();
  renderizar();
}

// ---- HISTÓRICO ----
function verHistorico(id) {
  const c = CLIENTES.find(item => item.id === id);
  if (!c) return;
  document.getElementById('histTitulo').textContent = `Histórico – ${c.nome}`;

  const lista = HISTORICO[id] || [];
  const cont = document.getElementById('histConteudo');

  if (lista.length === 0) {
    cont.innerHTML = `
      <div class="py-8 text-center text-gray-400">
        <p class="text-xs">Nenhum atendimento registrado para esta cliente.</p>
      </div>`;
  } else {
    cont.innerHTML = lista.map(h => `
      <div class="p-3 rounded-xl bg-gray-50 border border-gray-100 text-xs">
        <div class="flex items-center justify-between mb-1">
          <span class="font-semibold text-gray-800">${h.proc}</span>
          <span class="font-medium text-rose-600">${h.valor}</span>
        </div>
        <div class="flex items-center justify-between text-gray-400 text-[11px]">
          <span>Data: ${h.data}</span>
          ${h.obs ? `<span class="italic text-gray-500">${h.obs}</span>` : ''}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('modalHistorico').classList.add('show');
}

function fecharModalHist() {
  document.getElementById('modalHistorico').classList.remove('show');
}

// ---- EXCLUSÃO ----
function confirmarExclusao(id) {
  const c = CLIENTES.find(item => item.id === id);
  if (!c) return;
  clienteParaExcluir = id;
  document.getElementById('excluirMsg').textContent = `Deseja realmente excluir ${c.nome}?`;
  document.getElementById('btnConfirmarExcluir').onclick = executarExclusao;
  document.getElementById('modalExcluir').classList.add('show');
}

function fecharModalExcluir() {
  document.getElementById('modalExcluir').classList.remove('show');
  clienteParaExcluir = null;
}

function executarExclusao() {
  if (clienteParaExcluir !== null) {
    CLIENTES = CLIENTES.filter(c => c.id !== clienteParaExcluir);
    fecharModalExcluir();
    renderizar();
  }
}
</script>
</body>
</html>
